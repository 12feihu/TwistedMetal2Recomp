# Value selectors for "modifier" cheats.
#
# A GameShark modifier code carries a placeholder value -- the published code
# is "P1 Car Modifier 30164764 0000" and you are expected to substitute the
# car you want. A checkbox cannot express that, so these entries declare the
# value space and the debug menu renders a picker instead.
#
# Hand-maintained on purpose: guessing which cheats are parameterised from
# their names would be wrong often enough to matter. Anything not listed here
# stays a plain on/off toggle.
#
#   type = "choice"   value is an index into `choices`
#   type = "range"    value is a number in [min, max]
#
# `base` shifts a choice list that does not start at zero (the level tables in
# this game are 1-based). `default` is what the picker starts on.

# --- cars ------------------------------------------------------------------
# Order recovered from func_8012ADA0 / func_8012AEC4; see docs/CARS.md.
# Index 14 (Dark Tooth) is included deliberately: it is the only way to select
# it, since the game ships no select-screen entry for it.

[[param]]
cheats = ["p1-car-modifier", "p2-car-modifier",
          "computer-1-car-modifier", "computer-2-car-modifier",
          "computer-3-car-modifier", "computer-4-car-modifier",
          "computer-5-car-modifier", "computer-6-car-modifier",
          "computer-7-car-modifier", "computer-8-car-modifier",
          "computer-9-car-modifier"]
label = "Car"
type = "choice"
default = 0
choices = [
  "00 Hammerhead", "01 Outlaw 2", "02 Warthog", "03 Mr. Grimm",
  "04 Grasshopper", "05 Thumper", "06 Spectre", "07 Road Kill",
  "08 Twister", "09 Axel",
  "0A Mr. Slam", "0B Shadow", "0C Sweet Tooth", "0D Minion",
  "0E Dark Tooth (boss -- glitches periodically)",
]

# --- levels ----------------------------------------------------------------
# Recovered from the level jump tables at 0x800CFB58 (asset code) and
# 0x800CFB88 (display name), then corrected against what actually loads.
# One-based. See docs/LEVELS.md.
#
# Two slots do not match their names:
#   09  the display name is "It's a Secret" but the asset-code entry points at
#       the default handler, so there is no level to load -- it glitches.
#   0A  the display name is "Florida : Suicide Swamp" and the asset prefix is
#       SWAMP, but SWAMP.TMS/DMD actually contain a Jet Moto course. The swamp
#       level was never built; the slot carries an easter egg from SingleTrac's
#       other game instead. Labelled here by what loads, not by what the code
#       calls it.

[[param]]
cheats = ["always-play-level", "start-on-level"]
label = "Level"
type = "choice"
base = 1
default = 0
choices = [
  "01 Los Angeles : Quake Zone Rumble",
  "02 Moscow : Suicide Slide",
  "03 Paris : Monumental Disaster",
  "04 Amazonia : Fire Walk",
  "05 New York : The Big Leap",
  "06 Antarctica : The Drop Zone",
  "07 Holland : Field of Screams",
  "08 Hong Kong : Hong Kong Krunch",
  "09 (glitches -- no asset code)",
  "0A Jet Moto course (SWAMP slot)",
  "0B Los Angeles : Cyburbia",
  "0C Los Angeles : Roof Tops",
]

# --- from the cheat's own name ---------------------------------------------

[[param]]
cheats = ["number-of-human-players-in-the-battle-00-02"]
label = "Human players"
type = "range"
min = 0
max = 2
default = 1

# --- values not yet known --------------------------------------------------
# Open ranges until the real value tables are supplied. They are usable now --
# you can dial a number and watch what happens -- but the numbers are not
# labelled, so treat anything you find here as unverified.

# Difficulty has three settings, so 0/1/2 in order is the natural mapping.
# INFERRED, not read out of the game.
#
# Supporting evidence: the executable carries a log string at 0x800CFE10,
# "difficulty set to medium for this level", which fixes the middle label as
# "medium" rather than "normal". Medium is also the game's default, which is
# consistent with this ordering -- a default of 1 is the usual arrangement --
# though it does not prove it.
#
# It cannot be confirmed statically. 0x8001A23F is in the streamed low region,
# so it only means "difficulty" while the screen that owns it is loaded; at the
# title screen the same bytes are palette data and pointers. Confirming the
# order means reaching the Options screen and reading the byte while changing
# the setting.

[[param]]
cheats = ["difficulty-modifier"]
label = "Difficulty (order unconfirmed)"
type = "choice"
default = 0
choices = ["0 Easy", "1 Medium", "2 Hard"]

